<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>위대리 시트 · TQQQ 주간</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --bg:#0f0e0c; --surface:#1a1816; --surface-2:#252220; --surface-3:#2e2a26;
    --border:#3a3632; --border-lite:#2b2825;
    --text:#e8e3dc; --text-dim:#9a9188; --text-faint:#5c5550;
    --accent:#d4a574; --accent-dark:#8b6d50;
    --green:#7ca982; --red:#c47171; --yellow:#d4b974; --blue:#7a9ab8;
  }
  body { background:var(--bg); color:var(--text); font-family:'IBM Plex Sans KR',sans-serif;
    line-height:1.6; min-height:100vh; font-feature-settings:"tnum" 1; }
  .mono { font-family:'JetBrains Mono',monospace; }
  .container { max-width:1080px; margin:0 auto; padding:16px 12px 60px; }
  .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:8px; flex-wrap:wrap; }
  .app-title { font-size:17px; font-weight:700; }
  .app-title .accent { color:var(--accent); }
  .login-btn { background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
    padding:5px 11px; border-radius:14px; font-family:inherit; font-size:11px; font-weight:500;
    cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
  .login-btn:hover { border-color:var(--accent-dark); color:var(--text); }
  .login-btn.logged-in { color:var(--green); border-color:rgba(124,169,130,0.5); }
  .sync-indicator { width:6px; height:6px; border-radius:50%; background:var(--green); }
  .sync-indicator.syncing { background:var(--yellow); animation:pu 1.2s infinite; }
  .sync-indicator.error { background:var(--red); }
  @keyframes pu { 0%,100%{opacity:1;} 50%{opacity:0.2;} }

  .panel { background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:14px; margin-bottom:10px; }
  .panel-title { font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--accent); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }

  /* Order card */
  .order-card { background:linear-gradient(135deg,#1f1c19,#252220); border:1px solid var(--accent-dark);
    border-radius:12px; padding:16px; margin-bottom:10px; }
  .oc-top { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .badge { display:inline-block; padding:3px 10px; border-radius:6px; font-size:13px; font-weight:700; }
  .z초고평 { background:rgba(196,113,113,0.25); color:#d88c8c; }
  .z고평가 { background:rgba(224,149,105,0.25); color:#e9a984; }
  .z중간가 { background:rgba(154,145,136,0.25); color:#b8aea4; }
  .z저평가 { background:rgba(124,169,130,0.25); color:#94c19a; }
  .z초저평 { background:rgba(74,139,118,0.3); color:#6abea0; }
  .z초기매수 { background:rgba(212,165,116,0.25); color:var(--accent); }
  .oc-action { display:flex; align-items:baseline; margin:12px 0 8px; padding:12px 0;
    border-top:1px solid var(--border-lite); border-bottom:1px solid var(--border-lite); }
  .oc-verb { font-size:20px; font-weight:700; }
  .oc-verb.buy { color:var(--green); } .oc-verb.sell { color:var(--red); } .oc-verb.hold { color:var(--text-dim); }
  .oc-qty { font-family:'JetBrains Mono',monospace; font-size:30px; font-weight:700; color:var(--accent); margin-left:auto; }
  .oc-unit { font-size:13px; color:var(--text-dim); margin-left:4px; }
  .oc-detail { display:grid; grid-template-columns:1fr 1fr; gap:4px 16px; font-size:12px; }
  .oc-detail .row { display:flex; justify-content:space-between; }
  .oc-detail .k { color:var(--text-dim); }
  .oc-detail .v { font-family:'JetBrains Mono',monospace; font-weight:500; }
  .oc-detail .v.am { color:var(--accent); font-weight:600; }

  /* Ledger table */
  .tbl-wrap { overflow-x:auto; border:1px solid var(--border-lite); border-radius:8px; }
  table.ledger { border-collapse:collapse; font-size:11px; font-family:'JetBrains Mono',monospace; width:100%; min-width:920px; }
  .ledger th, .ledger td { padding:5px 7px; text-align:right; border-bottom:1px solid var(--border-lite); white-space:nowrap; }
  .ledger th { color:var(--text-faint); font-size:10px; font-weight:500; position:sticky; top:0; background:var(--surface); }
  .ledger td:first-child, .ledger th:first-child { text-align:left; }
  .ledger tr:last-child td { background:rgba(212,165,116,0.06); }
  .ledger input { background:var(--bg); border:1px solid var(--border); color:var(--text);
    padding:3px 5px; border-radius:4px; font-family:inherit; font-size:11px; text-align:right; }
  .ledger input.price { width:64px; }
  .ledger input.fill { width:44px; }
  .ledger input.dt { width:98px; text-align:left; }
  .ledger input:focus { outline:none; border-color:var(--accent); }
  .ledger input.overridden { border-color:var(--yellow); }
  .ledger .buy { color:var(--green); } .ledger .sell { color:var(--red); } .ledger .hold { color:var(--text-faint); }
  .zchip { display:inline-block; padding:0 5px; border-radius:4px; font-size:10px; }
  .del-btn { background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:12px; padding:0 4px; }
  .del-btn:hover { color:var(--red); }

  .btn { padding:12px; border:none; border-radius:10px; font-family:inherit; font-size:13px;
    font-weight:700; cursor:pointer; margin-bottom:8px; }
  .btn-primary { background:linear-gradient(135deg,#d4a574,#b88a5a); color:#1a1816; width:100%; }
  .btn-primary:disabled { opacity:0.4; cursor:wait; }
  .btn-ghost { background:var(--surface); color:var(--text-dim); border:1px solid var(--border); }
  .btn-row { display:flex; gap:8px; }
  .btn-row .btn { flex:1; margin-bottom:8px; }

  .cfg-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .cfg-row { display:flex; justify-content:space-between; align-items:center; gap:8px;
    background:var(--surface-2); border:1px solid var(--border-lite); padding:8px 11px; border-radius:8px; }
  .cfg-row label { font-size:12px; color:var(--text-dim); }
  .cfg-row input { background:var(--bg); border:1px solid var(--border); color:var(--text);
    padding:4px 7px; border-radius:5px; font-family:'JetBrains Mono',monospace; font-size:12px;
    width:76px; text-align:right; }
  .rate-table { width:100%; border-collapse:collapse; font-size:12px; font-family:'JetBrains Mono',monospace; margin-top:8px; }
  .rate-table th, .rate-table td { padding:4px 8px; text-align:center; border-bottom:1px solid var(--border-lite); }
  .rate-table th { color:var(--text-faint); font-size:10px; }
  .rate-table td:first-child { text-align:left; }
  .rate-table input { background:var(--bg); border:1px solid var(--border); color:var(--text);
    padding:3px 5px; border-radius:4px; font-family:inherit; font-size:11px; width:54px; text-align:right; }

  .collapsible-trigger { background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
    padding:10px 14px; border-radius:8px; font-family:inherit; font-size:12px; font-weight:500;
    cursor:pointer; width:100%; text-align:left; margin-bottom:8px;
    display:flex; justify-content:space-between; }
  .collapsible-content { display:none; }
  .collapsible-content.open { display:block; }
  .footer { margin-top:20px; padding:12px 0; text-align:center; font-size:10px; color:var(--text-faint);
    border-top:1px solid var(--border-lite); }
  .footer a { color:var(--accent); text-decoration:none; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(100px);
    background:var(--surface); border:1px solid var(--accent); color:var(--text); padding:10px 18px;
    border-radius:8px; font-size:13px; opacity:0; transition:all 0.3s; z-index:100; }
  .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
  .toast.error { border-color:var(--red); }
  .toast.success { border-color:var(--green); }
  .stat-strip { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .stat { flex:1; min-width:110px; background:var(--surface-2); border:1px solid var(--border-lite);
    border-radius:8px; padding:8px 10px; }
  .stat .k { font-size:10px; color:var(--text-faint); text-transform:uppercase; }
  .stat .v { font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:600; }
</style>
</head>
<body>
<div class="container">

  <div class="top-bar">
    <div class="app-title"><span class="accent">위대리</span> 시트 (원장식)</div>
    <button class="login-btn" id="loginBtn"><span id="loginBtnIcon">&#128272;</span><span id="loginBtnLabel">로그인</span></button>
  </div>

  <!-- 이번 주 주문 -->
  <div class="order-card" id="orderCard" style="display:none;">
    <div class="oc-top">
      <span class="badge" id="ocZone">-</span>
      <span class="mono" style="font-size:12px;color:var(--text-dim);" id="ocDev">-</span>
      <span class="mono" style="font-size:12px;color:var(--text-faint);margin-left:auto;" id="ocDate">-</span>
    </div>
    <div class="oc-action">
      <span class="oc-verb hold" id="ocVerb">홀드</span>
      <span class="oc-qty" id="ocQty">0</span><span class="oc-unit">주</span>
    </div>
    <div class="oc-detail">
      <div class="row"><span class="k">평가금 변동</span><span class="v" id="ocDelta">-</span></div>
      <div class="row"><span class="k">매매 예정금</span><span class="v am" id="ocPlanned">-</span></div>
      <div class="row"><span class="k">체결가</span><span class="v" id="ocPrice">-</span></div>
      <div class="row"><span class="k">추세</span><span class="v" id="ocTrend">-</span></div>
      <div class="row"><span class="k">거래 후 보유</span><span class="v" id="ocShares">-</span></div>
      <div class="row"><span class="k">거래 후 예수금</span><span class="v" id="ocCash">-</span></div>
    </div>
  </div>

  <div class="stat-strip">
    <div class="stat"><div class="k">보유</div><div class="v" id="stShares">-</div></div>
    <div class="stat"><div class="k">예수금</div><div class="v" id="stCash">-</div></div>
    <div class="stat"><div class="k">총자산</div><div class="v" id="stTotal">-</div></div>
    <div class="stat"><div class="k">수익률</div><div class="v" id="stRet">-</div></div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="addWeekBtn">+ 다음 주 추가 (야후 자동)</button>
  </div>

  <!-- 원장 테이블 -->
  <div class="panel">
    <div class="panel-title"><span>주간 원장 — 셀 수정 시 전체 재계산</span><span style="text-transform:none;color:var(--text-faint);font-weight:400;">체결칸 노란 테두리 = 계획과 다름</span></div>
    <div class="tbl-wrap">
      <table class="ledger" id="ledgerTable"></table>
    </div>
  </div>

  <!-- 설정 -->
  <button class="collapsible-trigger" id="cfgTrigger"><span>⚙️ 전략 설정 (시드/구간/비율)</span><span>▶</span></button>
  <div class="collapsible-content" id="cfgContent">
    <div class="panel">
      <div class="cfg-grid">
        <div class="cfg-row"><label>시드 ($)</label><input type="number" id="cfgSeed" step="1"></div>
        <div class="cfg-row"><label>예수금 보정 ($)</label><input type="number" id="cfgCashAdj" step="1"></div>
        <div class="cfg-row"><label>최소 주식비중 (%)</label><input type="number" id="cfgMinPct" step="1"></div>
        <div class="cfg-row"><label>초기 투입 (%)</label><input type="number" id="cfgInitPct" step="5"></div>
      </div>
      <table class="rate-table">
        <thead><tr><th>구간</th><th>편차</th><th>매도율%</th><th>매수율%</th></tr></thead>
        <tbody>
          <tr><td>초고평</td><td>&gt;<input id="cfgB1" style="width:48px"></td><td><input id="rsxh"></td><td><input id="rbxh"></td></tr>
          <tr><td>고평가</td><td>&gt;<input id="cfgB2" style="width:48px"></td><td><input id="rsh"></td><td><input id="rbh"></td></tr>
          <tr><td>중간가</td><td>&ge;<input id="cfgB3" style="width:48px"></td><td><input id="rsm"></td><td><input id="rbm"></td></tr>
          <tr><td>저평가</td><td>&ge;<input id="cfgB4" style="width:48px"></td><td><input id="rsl"></td><td><input id="rbl"></td></tr>
          <tr><td>초저평</td><td>그 외</td><td><input id="rsxl"></td><td><input id="rbxl"></td></tr>
        </tbody>
      </table>
      <div style="display:flex;gap:6px;margin-top:10px;">
        <button class="btn btn-ghost" id="saveCfgBtn" style="flex:1;">설정 저장</button>
        <button class="btn btn-ghost" id="resetBtn" style="color:var(--red);border-color:rgba(196,113,113,0.4);">⚠ 초기화</button>
      </div>
    </div>
  </div>

  <div class="footer">
    위대리(5구간)+[10%] 시트 이식 · 매주 종가 입력 → 시트와 동일한 전체 재계산<br>
    <a href="https://docs.google.com/spreadsheets/d/1gjUIPOmGcjLvhIXstIU8O0coW9OXqMDbgObn21qLw_8" target="_blank">원본 시트 (NATAS v6.0)</a>
  </div>
</div>
<div class="toast" id="toast"></div>

// ============================================================
//  엔진: 전체 재계산 (시트 공식)
// ============================================================
function logRegress(prices) {
  const n = prices.length;
  if (n < 2) return prices[n-1];
  let sx=0, sy=0, sxy=0, sx2=0;
  for (let i=0;i<n;i++){ sx+=i; const y=Math.log(prices[i]); sy+=y; sxy+=i*y; sx2+=i*i; }
  const m=(n*sxy-sx*sy)/(n*sx2-sx*sx), b=(sy-m*sx)/n;
  return Math.exp(b+m*(n-1));
}
function classifyZone(d, b) {
  if (d > b.b1/100) return '초고평';
  if (d > b.b2/100) return '고평가';
  if (d >= b.b3/100) return '중간가';
  if (d >= b.b4/100) return '저평가';
  return '초저평';
}

function computeAll() {
  const cfg = L.cfg;
  const rows = [];
  let planned = null, prevT = null;
  let shares = 0, cash = cfg.seed + (cfg.cashAdj||0), avg = 0;

  const qm = new Map(QQQ_HISTORY);
  for (const w of L.weeks) if (w[2]) qm.set(w[0], w[2]);
  const ALL = [...qm.entries()].sort((a,b)=>a[0].localeCompare(b[0]));

  for (let i = 0; i < L.weeks.length; i++) {
    const [date, t, q, fill] = L.weeks[i];
    const row = { i, date, t, q, fill };
    if (!t || !date) { rows.push(row); continue; }
    if (i === 0) {
      prevT = t;
      row.shares = shares; row.cash = cash; row.total = cash;
      rows.push(row); continue;
    }
    if (!q) { rows.push(row); continue; }

    const hist = ALL.filter(([d])=>d<date).map(([,p])=>p);
    hist.push(q);
    const trend = logRegress(hist);
    const dev = (q - trend) / trend;
    const zone = classifyZone(dev, cfg.bands);
    const r = cfg.rates[zone];
    row.trend = trend; row.dev = dev; row.zone = zone;

    if (planned === null) {
      const planShares = Math.floor(cfg.seed * (cfg.initPct/100) / t);
      const exec = (fill != null) ? fill : planShares;
      shares = exec; avg = t; cash -= exec * t;
      planned = cfg.seed;
      row.type = '초기매수'; row.planShares = planShares; row.exec = exec;
      row.realAmt = exec * t;
    } else {
      const expected = planned * t / prevT;
      const delta = expected - planned;
      const total = cash + shares * t;
      const minHold = Math.floor(total * (cfg.minPct/100) / t);
      row.delta = delta; row.minHold = minHold;

      let type = '홀드', realAmt = 0, planShares = 0, plannedAmt = 0;
      if (delta > 0.005) {
        type = '매도';
        plannedAmt = delta * r.sell/100;
        const maxAmt = Math.max(0, shares - minHold) * t;
        realAmt = Math.min(plannedAmt, maxAmt);
        planShares = Math.floor(realAmt / t);
      } else if (delta < -0.005) {
        type = '매수';
        plannedAmt = Math.abs(delta) * r.buy/100;
        realAmt = Math.min(plannedAmt, cash);
        planShares = Math.floor(realAmt / t);
      }
      const exec = (fill != null) ? fill : planShares;
      if (type === '매도' && exec > 0) { shares -= exec; cash += exec * t; }
      else if (type === '매수' && exec > 0) {
        const c = avg*shares + exec*t;
        shares += exec; avg = c / shares; cash -= exec * t;
      }
      planned = expected + (type === '매수' ? realAmt : (type === '매도' ? -realAmt : 0));
      row.type = type; row.planShares = planShares; row.exec = exec;
      row.plannedAmt = plannedAmt; row.realAmt = realAmt;
    }
    prevT = t;
    row.shares = shares; row.cash = cash; row.avg = avg;
    row.total = cash + shares * t; row.planned = planned;
    rows.push(row);
  }
  return rows;
}

function renderTable() {
  const tbl = document.getElementById('ledgerTable');
  let html = '<thead><tr><th>날짜</th><th>TQQQ</th><th>QQQ</th><th>구간</th><th>편차</th><th>변동</th><th>예정금</th><th>계획</th><th>체결</th><th>보유</th><th>예수금</th><th>자산</th><th></th></tr></thead><tbody>';
  for (const r of computedRows) {
    const isLast = r.i === L.weeks.length - 1;
    const fillOverridden = (r.fill != null && r.planShares != null && r.fill !== r.planShares);
    const typeCls = r.type === '매수' || r.type === '초기매수' ? 'buy' : (r.type === '매도' ? 'sell' : 'hold');
    const planTxt = r.type && r.type !== '홀드' ? `${r.type==='초기매수'?'매수':r.type} ${r.planShares}` : (r.type === '홀드' ? '홀드' : '');
    html += `<tr>
      <td><input class="dt" data-i="${r.i}" data-f="date" value="${r.date||''}"></td>
      <td><input class="price" data-i="${r.i}" data-f="t" value="${r.t!=null?r.t:''}" inputmode="decimal"></td>
      <td><input class="price" data-i="${r.i}" data-f="q" value="${r.q!=null?r.q:''}" inputmode="decimal"></td>
      <td>${r.zone?`<span class="zchip z${r.zone}">${r.zone}</span>`:''}</td>
      <td>${r.dev!=null?(r.dev*100).toFixed(1)+'%':''}</td>
      <td class="${r.delta>0?'sell':(r.delta<0?'buy':'')}">${r.delta!=null?Math.round(r.delta):''}</td>
      <td>${r.plannedAmt!=null&&r.plannedAmt>0?Math.round(r.plannedAmt):''}</td>
      <td class="${typeCls}">${planTxt}</td>
      <td>${r.i>0&&r.type?`<input class="fill ${fillOverridden?'overridden':''}" data-i="${r.i}" data-f="fill" value="${r.exec!=null?r.exec:''}" inputmode="numeric">`:''}</td>
      <td>${r.shares!=null?r.shares:''}</td>
      <td>${r.cash!=null?Math.round(r.cash).toLocaleString():''}</td>
      <td>${r.total!=null?Math.round(r.total).toLocaleString():''}</td>
      <td>${isLast&&r.i>0?`<button class="del-btn" data-del="${r.i}">✕</button>`:''}</td>
    </tr>`;
  }
  html += '</tbody>';
  tbl.innerHTML = html;

  tbl.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('change', onCellEdit);
  });
  tbl.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (confirm('마지막 행을 삭제할까요?')) {
        L.weeks.pop(); saveLedger(); render();
      }
    });
  });
  // 스크롤 맨 아래로
  const wrap = tbl.closest('.tbl-wrap');
  if (wrap) wrap.scrollTop = wrap.scrollHeight;
}

function onCellEdit(e) {
  const i = parseInt(e.target.dataset.i);
  const f = e.target.dataset.f;
  const v = e.target.value.trim();
  if (f === 'date') L.weeks[i][0] = v;
  else if (f === 't') L.weeks[i][1] = v === '' ? null : parseFloat(v);
  else if (f === 'q') L.weeks[i][2] = v === '' ? null : parseFloat(v);
  else if (f === 'fill') L.weeks[i][3] = v === '' ? null : parseInt(v);
  saveLedger();
  render();
}

  const card = document.getElementById('orderCard');
  const last = computedRows[computedRows.length - 1];
  if (!last || !last.zone) { card.style.display = 'none'; return; }
  card.style.display = 'block';
  const zEl = document.getElementById('ocZone');
  zEl.textContent = last.zone; zEl.className = 'badge z' + last.zone;
  document.getElementById('ocDev').textContent = 'QQQ 편차 ' + (last.dev*100).toFixed(2) + '%';
  document.getElementById('ocDate').textContent = last.date;
  const verb = document.getElementById('ocVerb');
  const t = last.type === '초기매수' ? '매수' : last.type;
  verb.textContent = t || '홀드';
  verb.className = 'oc-verb ' + (t === '매수' ? 'buy' : (t === '매도' ? 'sell' : 'hold'));
  document.getElementById('ocQty').textContent = last.planShares != null ? last.planShares : 0;
  document.getElementById('ocDelta').textContent = last.delta != null ?
    (last.delta>=0?'+':'') + '$' + Math.round(last.delta).toLocaleString() : '-';
  document.getElementById('ocPlanned').textContent = last.plannedAmt ? '$' + Math.round(last.plannedAmt).toLocaleString() : '-';
  document.getElementById('ocPrice').textContent = '$' + last.t.toFixed(2);
  document.getElementById('ocTrend').textContent = last.trend ? '$' + last.trend.toFixed(2) : '-';
  document.getElementById('ocShares').textContent = last.shares + '주';
  document.getElementById('ocCash').textContent = fmt$(last.cash);
}

function renderStats() {
  const last = computedRows[computedRows.length - 1];
  if (!last || last.total == null) return;
  document.getElementById('stShares').textContent = last.shares + '주';
  document.getElementById('stCash').textContent = fmt$(last.cash);
  document.getElementById('stTotal').textContent = fmt$(last.total);
  const ret = (last.total / L.cfg.seed - 1) * 100;
  const el = document.getElementById('stRet');
  el.textContent = (ret>=0?'+':'') + ret.toFixed(1) + '%';
  el.style.color = ret >= 0 ? 'var(--green)' : 'var(--red)';
}

// ============================================================
//  야후 자동 fetch + 다음 주 추가
// ============================================================
async function fetchYahoo(ticker, targetDate) {
  const tgt = new Date(targetDate);
  const s = new Date(tgt); s.setDate(tgt.getDate()-14);
  const e = new Date(tgt); e.setDate(tgt.getDate()+1);
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?period1=${Math.floor(s/1000)}&period2=${Math.floor(e/1000)}&interval=1d`;
  const proxies = [
    u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
    u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
  ];
  let err;
  for (const p of proxies) {
    try {
      const ctrl = new AbortController();
      const tm = setTimeout(() => ctrl.abort(), 9000);
      const res = await fetch(p(url), { signal: ctrl.signal });
      clearTimeout(tm);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      const result = j?.chart?.result?.[0];
      if (!result) throw new Error('no data');
      const ts = result.timestamp || [];
      const adj = result.indicators?.adjclose?.[0]?.adjclose || [];
      const cls = result.indicators?.quote?.[0]?.close || [];
      const prices = adj.length === ts.length ? adj : cls;
      let best = null, bestD = null;
      for (let i=0;i<ts.length;i++) {
        const d = new Date(ts[i]*1000).toISOString().slice(0,10);
        if (d <= targetDate && prices[i] != null) { best = prices[i]; bestD = d; }
      }
      if (best == null) throw new Error('no close');
      return { price: best, date: bestD };
    } catch(e2) { err = e2; }
  }
  throw err || new Error('all proxies failed');
}

async function addWeek() {
  const btn = document.getElementById('addWeekBtn');
  const lastDate = L.weeks.length ? L.weeks[L.weeks.length-1][0] : null;
  let next;
  if (lastDate) { next = new Date(lastDate); next.setDate(next.getDate()+7); }
  else { next = new Date(); }
  const nextStr = next.toISOString().slice(0,10);

  btn.disabled = true; btn.textContent = '야후에서 가져오는 중...';
  try {
    const [t, q] = await Promise.all([fetchYahoo('TQQQ', nextStr), fetchYahoo('QQQ', nextStr)]);
    const useDate = t.date;  // 비거래일이면 직전 거래일
    if (L.weeks.some(w => w[0] === useDate)) {
      showToast('이미 있는 날짜입니다: ' + useDate, 'error');
    } else {
      L.weeks.push([useDate, Math.round(t.price*100)/100, Math.round(q.price*100)/100, null]);
      saveLedger(); render();
      showToast('✅ ' + useDate + ' 추가됨', 'success');
    }
  } catch(e) {
    // 실패 시 빈 행 추가 (수동 입력)
    L.weeks.push([nextStr, null, null, null]);
    saveLedger(); render();
    showToast('자동입력 실패 — 수동으로 입력하세요', 'error');
  } finally {
    btn.disabled = false; btn.textContent = '+ 다음 주 추가 (야후 자동)';
  }
}

  document.getElementById('cfgMinPct').value = c.minPct;
  document.getElementById('cfgInitPct').value = c.initPct;
  document.getElementById('cfgB1').value = c.bands.b1;
  document.getElementById('cfgB2').value = c.bands.b2;
  document.getElementById('cfgB3').value = c.bands.b3;
  document.getElementById('cfgB4').value = c.bands.b4;
  document.getElementById('rsxh').value = c.rates['초고평'].sell;
  document.getElementById('rbxh').value = c.rates['초고평'].buy;
  document.getElementById('rsh').value = c.rates['고평가'].sell;
  document.getElementById('rbh').value = c.rates['고평가'].buy;
  document.getElementById('rsm').value = c.rates['중간가'].sell;
  document.getElementById('rbm').value = c.rates['중간가'].buy;
  document.getElementById('rsl').value = c.rates['저평가'].sell;
  document.getElementById('rbl').value = c.rates['저평가'].buy;
  document.getElementById('rsxl').value = c.rates['초저평'].sell;
  document.getElementById('rbxl').value = c.rates['초저평'].buy;
}
function saveCfgUI() {
  const g = id => parseFloat(document.getElementById(id).value);
  L.cfg.seed = g('cfgSeed'); L.cfg.cashAdj = g('cfgCashAdj');
  L.cfg.minPct = g('cfgMinPct'); L.cfg.initPct = g('cfgInitPct');
  L.cfg.bands = { b1:g('cfgB1'), b2:g('cfgB2'), b3:g('cfgB3'), b4:g('cfgB4') };
  L.cfg.rates = {
    '초고평':{sell:g('rsxh'),buy:g('rbxh')}, '고평가':{sell:g('rsh'),buy:g('rbh')},
    '중간가':{sell:g('rsm'),buy:g('rbm')}, '저평가':{sell:g('rsl'),buy:g('rbl')},
    '초저평':{sell:g('rsxl'),buy:g('rbxl')},
  };
  saveLedger(); render();
  showToast('⚙️ 설정 저장됨', 'success');
}

// ============================================================
//  토스트 / Firebase 동기화 (동파법 패턴)
// ============================================================
let toastTimer = null;
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type||'');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = 'toast ' + (type||''), 2500);
}

const SYNC = { enabled: false, unsubscribe: null, lastAt: null };
function docRef() {
  if (!firebaseUser || !firebaseDb) return null;
  return firebaseDb.collection('widae_users').doc(firebaseUser.uid);
}
function deviceLabel() {
  const ua = navigator.userAgent;
  if (/iPhone|iPad/i.test(ua)) return 'iPhone';
  if (/Android/i.test(ua)) return 'Android';
  if (/Mac/i.test(ua)) return 'Mac';
  if (/Windows/i.test(ua)) return 'Windows';
  return 'Web';
}
function setSyncUI(status, err) {
  const btn = document.getElementById('loginBtn');
  const label = document.getElementById('loginBtnLabel');
  const icon = document.getElementById('loginBtnIcon');
  if (!SYNC.enabled) {
    btn.classList.remove('logged-in');
    icon.textContent = String.fromCodePoint(128272);
    label.textContent = '로그인';
    return;
  }
  btn.classList.add('logged-in');
  icon.textContent = '';
  const name = (firebaseUser && (firebaseUser.displayName||firebaseUser.email||'').split(/[\s@]/)[0]) || '';
  const cls = status==='syncing'||status==='pending' ? 'syncing' : (status==='error' ? 'error' : '');
  label.innerHTML = '<span class="sync-indicator ' + cls + '"></span>' + name;
  btn.title = status==='error' ? ('오류: '+(err||'')) : ('동기화: ' + (SYNC.lastAt?SYNC.lastAt.toLocaleTimeString():'-'));
}
async function upload() {
  if (!firebaseUser) return false;
  setSyncUI('syncing');
  try {
    await docRef().set({
      sheet: localStorage.getItem(STORAGE_KEY) || '',
      sheetUpdatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      device: deviceLabel(),
    }, { merge: true });
    SYNC.lastAt = new Date();
    setSyncUI('synced');
    return true;
  } catch(e) { setSyncUI('error', e.message); return false; }
}
async function download() {
  if (!firebaseUser) return false;
  setSyncUI('syncing');
  try {
    const doc = await docRef().get();
    if (!doc.exists || !doc.data().sheet) return await upload();
    _origSet(STORAGE_KEY, doc.data().sheet);
    L = loadLedger(); loadCfgUI(); render();
    setSyncUI('synced');
    return true;
  } catch(e) { setSyncUI('error', e.message); return false; }
}
function startListen() {
  if (!firebaseUser) return;
  if (SYNC.unsubscribe) SYNC.unsubscribe();
  let first = true;
  SYNC.unsubscribe = docRef().onSnapshot({ includeMetadataChanges: true }, (doc) => {
    if (first) { first = false; return; }
    if (doc.metadata.hasPendingWrites) return;
    if (doc.exists && doc.data().sheet && doc.data().sheet !== localStorage.getItem(STORAGE_KEY)) {
      _origSet(STORAGE_KEY, doc.data().sheet);
      L = loadLedger(); loadCfgUI(); render();
      showToast('🔄 다른 기기에서 동기화됨', 'success');
    }
  }, (err) => setSyncUI('error', err.message));
}
const _origSet = localStorage.setItem.bind(localStorage);
let upTimer = null;
localStorage.setItem = function(k, v) {
  _origSet(k, v);
  if (k === STORAGE_KEY && SYNC.enabled) {
    setSyncUI('pending');
    if (upTimer) clearTimeout(upTimer);
    upTimer = setTimeout(upload, 1500);
  }
};
async function loginGoogle() {
  if (!firebaseEnabled) { alert('Firebase 초기화 실패. 광고차단기를 끄고 새로고침하세요.'); return; }
  try {
    const result = await firebaseAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    firebaseUser = result.user;
    SYNC.enabled = true;
    const doc = await docRef().get();
    const localData = localStorage.getItem(STORAGE_KEY);
    const hasCloud = doc.exists && doc.data().sheet && doc.data().sheet.length > 10;
    if (hasCloud && localData && doc.data().sheet !== localData) {
      const msg = '클라우드에 데이터가 있습니다.\n[확인] 클라우드 → 이 기기\n[취소] 이 기기 → 클라우드';
      if (confirm(msg)) await download(); else await upload();
    } else if (hasCloud) { await download(); }
    else { await upload(); }
    startListen();
    setSyncUI('synced');
    showToast('✅ 동기화 활성화', 'success');
  } catch(e) {
    if (e.code === 'auth/popup-closed-by-user') return;
    if (e.code === 'auth/popup-blocked') { alert('팝업이 차단됨. 주소창 옆 팝업 허용을 눌러주세요.'); return; }
    if (e.code === 'auth/unauthorized-domain') { alert('도메인 미승인: Firebase 콘솔 > Authentication > Settings > 승인된 도메인에 추가:\n' + location.hostname); return; }
    alert('로그인 실패: ' + e.message);
  }
}
function onLoginClick() {
  if (SYNC.enabled) {
    const c = prompt((firebaseUser&&firebaseUser.email||'') + '\n\n1 - 지금 업로드\n2 - 클라우드에서 다운로드\n3 - 로그아웃\n4 - 취소', '1');
    if (c === '1') upload().then(()=>showToast('동기화 완료','success'));
    else if (c === '2') { if (confirm('클라우드로 덮어씁니다. 계속?')) download(); }
    else if (c === '3') {
      if (SYNC.unsubscribe) { SYNC.unsubscribe(); SYNC.unsubscribe = null; }
      firebaseAuth.signOut().then(() => {
        firebaseUser = null; SYNC.enabled = false; setSyncUI('logged-out');
        showToast('로그아웃됨','success');
      });
    }
  } else { loginGoogle(); }
}
function initAuth() {
  if (!firebaseEnabled) return;
  firebaseAuth.onAuthStateChanged((user) => {
    if (user) { firebaseUser = user; SYNC.enabled = true; setSyncUI('synced'); startListen(); }
    else { firebaseUser = null; SYNC.enabled = false; setSyncUI('logged-out'); }
  });
}

    localStorage.removeItem(STORAGE_KEY);
    L = defaultLedger(); saveLedger(); loadCfgUI(); render();
  }
});
document.getElementById('cfgTrigger').addEventListener('click', () => {
  document.getElementById('cfgContent').classList.toggle('open');
});
document.getElementById('loginBtn').addEventListener('click', onLoginClick);

loadCfgUI();
render();
initAuth();
